name: Bug report
description: Something in the app doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't include real names, health details, or your answers. Describe the problem with made-up data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: '1. Choose Texas 2. …'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and build
      description: Shown in the footer, e.g. "v1.0.0 (build 42)".
  - type: input
    id: browser
    attributes:
      label: Browser and device
