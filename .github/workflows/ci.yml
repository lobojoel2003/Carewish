name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  BUILD_NUMBER: ${{ github.run_number }}
  COMMIT_SHA: ${{ github.sha }}

jobs:
  quality:
    name: Lint, format & types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate state rules (schema + semantic checks)
        run: pnpm --filter @carewish/form-rules validate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            packages/form-rules/coverage/lcov.info
            apps/web/coverage/lcov.info
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack the rules library
        run: pnpm --filter @carewish/form-rules pack --pack-destination ../../artifacts
      - name: Check the packed library
        run: |
          set -euo pipefail
          tar -tzf artifacts/carewish-form-rules-*.tgz | tee /tmp/files.txt
          grep -q 'package/dist/index.js' /tmp/files.txt
          grep -q 'package/dist/index.cjs' /tmp/files.txt
          grep -q 'package/states/CA.yaml' /tmp/files.txt
          grep -q 'package/LICENSE' /tmp/files.txt
          mkdir -p /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/artifacts/carewish-form-rules-*.tgz
          node -e "const r=require('@carewish/form-rules'); if (r.listStates().length !== 51) process.exit(1); console.log('CJS ok')"
          node --input-type=module -e "import { requireState } from '@carewish/form-rules'; console.log('ESM ok', requireState('CA').name)"
      - uses: actions/upload-artifact@v7
        with:
          name: form-rules-package
          path: artifacts/*.tgz
          retention-days: 14

  e2e:
    name: End-to-end (Playwright + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carewish
          POSTGRES_PASSWORD: carewish
          POSTGRES_DB: carewish
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U carewish"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://carewish:carewish@localhost:5432/carewish
      CAREWISH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply database migrations
        run: pnpm --filter @carewish/web db:migrate
      - name: Install Chromium
        run: pnpm --filter @carewish/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  fhir:
    name: FHIR validation (HL7 validator, PACIO ADI 1.0.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:rules
      - name: Generate sample bundles
        run: pnpm samples
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache FHIR packages
        uses: actions/cache@v6
        with:
          path: ~/.fhir/packages
          key: fhir-packages-pacio-adi-1.0.0
      - name: Download the HL7 FHIR validator
        run: curl -fsSL -o validator_cli.jar https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar
      - name: Validate against the PACIO ADI implementation guide
        run: |
          set -o pipefail
          java -jar validator_cli.jar apps/web/samples/*.fhir.json \
            -version 4.0.1 \
            -ig hl7.fhir.us.pacio-adi#1.0.0 \
            -tx n/a \
            -output fhir-validation.json | tee fhir-validation.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fhir-validation
          path: |
            fhir-validation.json
            fhir-validation.txt
            apps/web/samples/*.fhir.json
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: carewish:ci
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          set -euo pipefail
          docker run -d --name carewish -p 3000:3000 carewish:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -o /dev/null http://localhost:3000/fonts/AtkinsonHyperlegible-Regular.ttf
          docker logs carewish
