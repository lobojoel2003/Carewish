$schema: ../schema/state.schema.json
code: AL
name: Alabama
adultAge: 19
terminology:
  agent: health-care-proxy
documents:
  - id: advance-directive-for-health-care
    title: Advance Directive for Health Care
    kind: combined
    citation: Ala. Code § 22-8A-4
    parts:
      - title: 'Section 1: Living Will'
        sections:
          [principal, life-sustaining, nutrition, cpr, pain-relief, values, additional-wishes]
      - title: 'Section 2: If I Need Someone to Speak for Me (Health Care Proxy)'
        sections: [agent, alternate-agent, agent-authority]
    execution:
      method: witnesses
      witnesses:
        count: 2
        minAge: 19
        rules:
          - type: none-may-be
            attributes: [signed-for-principal, relative, heir, financially-responsible]
sources:
  - citation: Ala. Code §§ 22-8A-1 to 22-8A-14 (Natural Death Act)
review:
  status: needs-review
  lastChecked: 2026-11-18
