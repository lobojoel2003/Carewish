    title: Durable Health Care Power of Attorney and Health Care Treatment Instructions (Living Will)
    kind: combined
    citation: 20 Pa. Cons. Stat. §§ 5442, 5452, 5471
    parts:
      - title: 'Part II: Durable Health Care Power of Attorney'
        sections: [principal, agent, alternate-agent, agent-authority]
      - title: 'Part III: Health Care Treatment Instructions in the Event of End-Stage Medical Condition or Permanent Unconsciousness (Living Will)'
        sections:
          [life-sustaining, nutrition, cpr, pain-relief, values, additional-wishes, organ-donation]
    execution:
      method: witnesses
      witnesses:
        count: 2
        minAge: 18
        rules:
          - type: none-may-be
            attributes: [signed-for-principal]
