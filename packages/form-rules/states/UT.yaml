    title: Utah Advance Health Care Directive
    kind: combined
    citation: Utah Code Ann. §§ 75-2a-107, 75-2a-117
    parts:
      - title: 'Part I: Allow Another Person to Make Health Care Decisions'
        sections: [principal, agent, alternate-agent, agent-authority]
      - title: 'Part II: Make My Own Health Care Decisions'
        sections:
          [life-sustaining, nutrition, cpr, pain-relief, values, additional-wishes, organ-donation]
    execution:
      method: witnesses
      witnesses:
        count: 1
        minAge: 18
        rules:
          - type: none-may-be
            attributes:
              [
                signed-for-principal,
                agent,
                relative,
                heir,
                beneficiary,
                financially-responsible,
                healthcare-provider,
                facility-employee,
              ]
sources:
  - citation: Utah Code Ann. tit. 75, ch. 2a (Advance Health Care Directive Act)
