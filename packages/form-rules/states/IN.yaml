$schema: ../schema/state.schema.json
code: IN
name: Indiana
adultAge: 18
terminology:
  agent: health-care-representative
documents:
  - id: advance-directive-for-health-care
    title: Indiana Advance Directive for Health Care Decisions
    kind: combined
    citation: Ind. Code § 16-36-7-28
    parts:
      - title: Appointment of Health Care Representative
        sections: [principal, agent, alternate-agent, agent-authority]
      - title: Health Care Instructions
        sections:
          [life-sustaining, nutrition, cpr, pain-relief, values, additional-wishes, organ-donation]
    execution:
      method: witnesses-or-notary
      witnesses:
        count: 2
        minAge: 18
        rules:
          - type: none-may-be
            attributes: [agent]
          - type: at-least-one-not
            attributes: [spouse, relative]
