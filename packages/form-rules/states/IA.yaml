$schema: ../schema/state.schema.json
code: IA
name: Iowa
adultAge: 18
terminology:
  agent: health-care-agent
documents:
  - id: durable-power-of-attorney-for-health-care
    title: Durable Power of Attorney for Health Care
    kind: power-of-attorney
    citation: Iowa Code §§ 144B.3, 144B.5
    parts:
      - title: Durable Power of Attorney for Health Care
        sections: [principal, agent, alternate-agent, agent-authority]
    execution:
      method: witnesses-or-notary
      witnesses:
        count: 2
        minAge: 18
        rules:
          - type: none-may-be
            attributes: [agent, healthcare-provider, provider-employee]
          - type: at-least-one-not
            attributes: [relative-within-third-degree]
  - id: declaration
    title: Declaration (Living Will)
    kind: living-will
    citation: Iowa Code § 144A.3
    parts:
      - title: Declaration
        sections:
          [principal, life-sustaining, nutrition, cpr, pain-relief, values, additional-wishes]
    execution:
      method: witnesses-or-notary
      witnesses:
        count: 2
        minAge: 18
        rules:
          - type: none-may-be
            attributes: [healthcare-provider, provider-employee]
          - type: at-least-one-not
            attributes: [relative-within-third-degree]
sources:
  - citation: Iowa Code ch. 144A (Life-Sustaining Procedures Act)
  - citation: Iowa Code ch. 144B (Durable Power of Attorney for Health Care)
review:
  status: needs-review
  lastChecked: 2026-11-18
